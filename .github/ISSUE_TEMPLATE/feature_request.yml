name: Feature request
description: Suggest something PenguPool AI could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Agents you use, how often this comes up, workarounds you tried
