name: release

# Builds, signs and notarizes the disk image for a GitHub release when someone publishes it, and attaches it
# to that release (make dist, then make publish). Only a tag on main that matches the version is built.
# Signing and notarizing use the runner Mac's login keychain (the Developer ID identity and the notarytool
# profile "pengupool"); no GitHub secret holds them. The write-scoped token goes only to the steps that talk to
# GitHub, never to the build and its dependencies. A release made with a workflow's GITHUB_TOKEN starts no run.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token stays out of .git/config, out of the build's reach
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # self-hosted: Go keeps its module and build cache on the runner
      - name: Node from Homebrew
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(sed -n 's/^const Version = "\(.*\)"/\1/p' cmd/pengupool/main.go)
          [ -n "$V" ] || { echo "::error::no version in cmd/pengupool/main.go"; exit 1; }
          [ "$TAG" = "v$V" ] || { echo "::error::release tag $TAG does not match the version v$V in cmd/pengupool/main.go"; exit 1; }
          SHA=$(git rev-parse HEAD)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status) ||
            { echo "::error::cannot compare $TAG with main (GitHub auth or network)"; exit 1; }
          case $status in
          identical | behind) ;;
          *) echo "::error::$TAG ($SHA) is not on main (compare: $status): publish releases from main only"; exit 1 ;;
          esac
          security find-identity -v -p codesigning | grep -q '"Developer ID Application: ' ||
            { echo "::error::no Developer ID Application identity in the runner's keychain: the build could not be signed"; exit 1; }
          xcrun notarytool history --keychain-profile pengupool >/dev/null 2>&1 ||
            { echo "::error::notarytool cannot use the keychain profile \"pengupool\": the build could not be notarized"; exit 1; }
          echo "building $TAG at $(git rev-parse --short HEAD)"
      - name: Build, sign and notarize
        run: make dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish
